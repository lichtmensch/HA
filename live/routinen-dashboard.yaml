      | Tag | {{ states(''input_datetime.rt_kuche_dimmer_zeit_093000'')[:5] }}–{{ states(''input_datetime.rt_kuche_dimmer_zeit_200000'')[:5]
      }} | {{ states(''input_number.rt_kuche_dimmer_b_day'') | int }} % · {{ states(''input_number.rt_kuche_dimmer_k_day'')
      | int }} K |

      | Abend | {{ states(''input_datetime.rt_kuche_dimmer_zeit_200000'')[:5] }}–{{ states(''input_datetime.rt_kuche_dimmer_zeit_233000'')[:5]
      }} | {{ states(''input_number.rt_kuche_dimmer_b_evening'') | int }} % · {{ states(''input_number.rt_kuche_dimmer_k_warm'')
      | int }} K |

      | Nacht | übrige Zeiten | {{ states(''input_number.rt_kuche_dimmer_b_night'') | int }} % · blauer Farbton (editierbar)
      |


      Taste 1 = Zeitprofil, Taste 2/3 kurz = dimmen, Taste 4 = aus. Der bestehende manuelle Vorrang bleibt erhalten. Die separate
      Küchen-Bewegungsroutine ist weiterhin ausgeschaltet.'
