ipad_wieder_da:
  alias: iPad Flur - Wieder da
  description: Stellt den beim Verlassen gespeicherten Lichtzustand wieder her.
  icon: mdi:home-import-outline
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states.scene.ipad_lichtzustand_vor_verlassen is not none
          }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ipad_lichtzustand_vor_verlassen
        data:
          transition: 1
    default:
    - action: persistent_notification.create
      data:
        title: Lichtzustand nicht gespeichert
        message: Bitte zuerst auf Haus verlassen tippen, damit ein Lichtzustand gespeichert
          wird.
        notification_id: ipad_lichtzustand_fehlt
rollo_position_sicher_anfahren:
  alias: Rollo - Position sicher anfahren
  description: 'Fährt ein Rollo auf eine Zielposition und wiederholt den Befehl genau
    einmal, falls ein kurzer Verbindungsabbruch die erste Ausführung verhindert.

    '
  mode: parallel
  max: 10
  fields:
    rollo:
      name: Rollo
      description: Das zu steuernde Rollo
      required: true
      selector:
        entity:
          domain: cover
    zielposition:
      name: Zielposition
      description: Gewünschte Position von 0 bis 100 Prozent
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
  sequence:
  - variables:
      start_position: '{{ state_attr(rollo, ''current_position'') | int(-1) }}'
      ziel: '{{ zielposition | int }}'
  - if:
    - condition: template
      value_template: '{{ states(rollo) in [''unavailable'', ''unknown''] }}'
    then:
    - wait_template: '{{ states(rollo) not in [''unavailable'', ''unknown''] }}'
      timeout: 00:00:15
      continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ states(rollo) not in [''unavailable'', ''unknown''] }}'
    then:
    - action: cover.set_cover_position
      continue_on_error: true
      target:
        entity_id: '{{ rollo }}'
      data:
        position: '{{ ziel }}'
  - delay: 00:00:07
  - variables:
      position_nach_befehl: '{{ state_attr(rollo, ''current_position'') | int(-1)
        }}'
      zustand_nach_befehl: '{{ states(rollo) }}'
  - if:
    - condition: template
      value_template: "{{ position_nach_befehl != start_position\n   or position_nach_befehl
        == ziel\n   or zustand_nach_befehl in ['opening', 'closing'] }}\n"
    then: []
    else:
    - wait_template: '{{ states(rollo) not in [''unavailable'', ''unknown''] }}'
      timeout: 00:00:15
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ states(rollo) not in [''unavailable'', ''unknown''] }}'
      then:
      - action: cover.set_cover_position
        continue_on_error: true
        target:
          entity_id: '{{ rollo }}'
        data:
          position: '{{ ziel }}'
