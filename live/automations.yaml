    - light.hue_filament_bulb_2
    - light.hue_filament_bulb_3
    dimm_lampen:
    - light.hue_filament_bulb_1
    - light.hue_filament_bulb_2
    - light.hue_filament_bulb_3
    - light.hue_play_gradient_lightstrip_1
    - light.hue_color_floor_1
- id: '1771745540570'
  alias: Rollos - Sonnenzeiten + Wochenplan
  description: Abends schließen/teilweise; morgens + Zeitplan öffnen
  triggers:
  - trigger: sun
    event: sunset
    offset: 00:30:00
    id: sunset_30
  - trigger: sun
    event: sunrise
    offset: 00:30:00
    id: sunrise_30_weekday
  - trigger: sun
    event: sunrise
    offset: 01:00:00
    id: sunrise_60_weekend
  - trigger: time
    at: input_datetime.rt_rollo_weekday_0700
    id: weekday_0700
  - trigger: time
    at: input_datetime.rt_rollo_weekend_0830
    id: weekend_0830
  - trigger: time
    at: input_datetime.rt_rollo_weekday_1000
    id: weekday_1000
  - trigger: time
    at: input_datetime.rt_rollo_weekend_1100
    id: weekend_1100
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset_30
      sequence:
      - parallel:
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9cc4f4_rollo_bad
              zielposition: '{{ states(''input_number.rt_rollo_bad_abend'') | float(0) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
              zielposition: '{{ states(''input_number.rt_rollo_gaste_wc_abend'') | float(0) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.wohnzimmerfenster_rollo
              zielposition: '{{ states(''input_number.rt_rollo_wohnzimmer_abend'') | float(40) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9a6bb0_rollo_gastezimmer
              zielposition: '{{ states(''input_number.rt_rollo_gastezimmer_abend'') | float(25) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.rollo_schlafzimmer
              zielposition: '{{ states(''input_number.rt_rollo_schlafzimmer_abend'') | float(25) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.terrassentur_rollo_rollo_terrassentur
              zielposition: '{{ states(''input_number.rt_rollo_terrasse_abend'') | float(25) }}'
    - conditions:
      - condition: trigger
        id:
        - sunrise_30_weekday
        - weekday_0700
      - condition: template
        value_template: '{{ now().weekday() < 5 and now().strftime(''%H:%M'') >= states(''input_datetime.rt_rollo_weekday_0700'')[:5]
          }}'
      - condition: sun
        after: sunrise
        after_offset: 00:30:00
      sequence:
      - parallel:
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9cc4f4_rollo_bad
              zielposition: '{{ states(''input_number.rt_rollo_bad_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
              zielposition: '{{ states(''input_number.rt_rollo_gaste_wc_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.wohnzimmerfenster_rollo
              zielposition: '{{ states(''input_number.rt_rollo_wohnzimmer_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.terrassentur_rollo_rollo_terrassentur
              zielposition: '{{ states(''input_number.rt_rollo_terrasse_morgen'') | float(100) }}'
    - conditions:
      - condition: trigger
        id:
        - sunrise_60_weekend
        - weekend_0830
      - condition: template
        value_template: '{{ now().weekday() >= 5 and now().strftime(''%H:%M'') >= states(''input_datetime.rt_rollo_weekend_0830'')[:5]
          }}'
      - condition: sun
        after: sunrise
        after_offset: 01:00:00
      sequence:
      - parallel:
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9cc4f4_rollo_bad
              zielposition: '{{ states(''input_number.rt_rollo_bad_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
              zielposition: '{{ states(''input_number.rt_rollo_gaste_wc_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.wohnzimmerfenster_rollo
              zielposition: '{{ states(''input_number.rt_rollo_wohnzimmer_morgen'') | float(100) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.terrassentur_rollo_rollo_terrassentur
              zielposition: '{{ states(''input_number.rt_rollo_terrasse_morgen'') | float(100) }}'
    - conditions:
      - condition: trigger
        id: weekday_1000
      - condition: template
        value_template: '{{ now().weekday() < 5 }}'
      sequence:
      - parallel:
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.rollo_schlafzimmer
              zielposition: '{{ states(''input_number.rt_rollo_schlafzimmer_morgen'') | float(87) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9a6bb0_rollo_gastezimmer
              zielposition: '{{ states(''input_number.rt_rollo_gastezimmer_morgen'') | float(100) }}'
    - conditions:
      - condition: trigger
        id: weekend_1100
      - condition: template
        value_template: '{{ now().weekday() >= 5 }}'
      sequence:
      - parallel:
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.rollo_schlafzimmer
              zielposition: '{{ states(''input_number.rt_rollo_schlafzimmer_morgen'') | float(87) }}'
        - sequence:
          - action: script.rollo_position_sicher_anfahren
            data:
              rollo: cover.shelly2pmg3_8cbfea9a6bb0_rollo_gastezimmer
              zielposition: '{{ states(''input_number.rt_rollo_gastezimmer_morgen'') | float(100) }}'
- id: '1771746410073'
  alias: Rollos - Sonnenschutz Westseite intelligent
  description: Faehrt die Westrollos auf 40 %, wenn Westsonne und Waermebedarf zusammentreffen. Beruecksichtigt Raumtemperaturen,
    Tagesprognose, den Sonnensensor am Westfenster, Regen und Wind. Direkte Sonne muss mindestens drei Minuten anliegen. Manuelle
    Eingriffe bleiben geschuetzt.
  triggers:
  - trigger: state
    entity_id:
    - sun.sun
    - sensor.weather_station_aussen_temperatur
    - sensor.weather_station_temperatur
    - sensor.weather_station_schlafzimmer_temperatur
    - sensor.weather_station_gastezimmer_temperatur
    - sensor.wetter_heute_temperatur_max
    - sensor.weather_station_windmesser_windgeschwindigkeit
    - sensor.weather_station_windmesser_boenstarke
    - sensor.weather_station_regenmesser_niederschlagsmenge_letzte_stunde
    - weather.forecast_home
  - trigger: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    to: 'on'
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.rollo_west_manuell_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
    state: 'off'
  - condition: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_3_beleuchtungsstarke
    above: 2499
  - condition: template
    value_template: "{% set outside = states('sensor.weather_station_aussen_temperatur') | float(-99) %} {% set living = states('sensor.weather_station_temperatur')\
      \ | float(-99) %} {% set bedroom = states('sensor.weather_station_schlafzimmer_temperatur') | float(-99) %} {% set guest\
      \ = states('sensor.weather_station_gastezimmer_temperatur') | float(-99) %} {% set forecast_max = states('sensor.wetter_heute_temperatur_max')\
      \ | float(-99) %} {% set wind = states('sensor.weather_station_windmesser_windgeschwindigkeit') | float(0) %} {% set\
      \ gust = states('sensor.weather_station_windmesser_boenstarke') | float(0) %} {% set rain = states('sensor.weather_station_regenmesser_niederschlagsmenge_letzte_stunde')\
      \ | float(0) %} {% set elevation = state_attr('sun.sun', 'elevation') | float(-90) %} {% set azimuth = state_attr('sun.sun',\
      \ 'azimuth') | float(0) %} {{ outside > 22\n  and (living >= 24 or bedroom >= 24 or guest >= 24 or forecast_max >= 26)\n\
      \  and elevation > 10 and 240 < azimuth < 300\n  and rain <= 0.1 and wind < 30 and gust < 45 }}"
  actions:
  - parallel:
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.wohnzimmerfenster_rollo
          zielposition: '{{ states(''input_number.rt_rollo_wohnzimmer_sonnenschutz'') | float(40) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.rollo_schlafzimmer
          zielposition: '{{ states(''input_number.rt_rollo_schlafzimmer_sonnenschutz'') | float(40) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
          zielposition: '{{ states(''input_number.rt_rollo_gaste_wc_sonnenschutz'') | float(40) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.terrassentur_rollo_rollo_terrassentur
          zielposition: '{{ states(''input_number.rt_rollo_terrasse_sonnenschutz'') | float(40) }}'
  - delay: 00:00:05
  - wait_template: "{{ not is_state('cover.wohnzimmerfenster_rollo', 'opening')\n  and not is_state('cover.wohnzimmerfenster_rollo',\
      \ 'closing')\n  and not is_state('cover.rollo_schlafzimmer', 'opening')\n  and not is_state('cover.rollo_schlafzimmer',\
      \ 'closing')\n  and not is_state('cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc', 'opening')\n  and not is_state('cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc',\
      \ 'closing')\n  and not is_state('cover.terrassentur_rollo_rollo_terrassentur', 'opening')\n  and not is_state('cover.terrassentur_rollo_rollo_terrassentur',\
      \ 'closing') }}"
    timeout: 00:02:00
    continue_on_timeout: true
  - delay: 00:00:10
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
  mode: single
- id: '1788540000001'
  alias: Rollos - Sonnenschutz Westseite automatisch beenden
  description: Oeffnet nur automatisch beschattete Westrollos wieder, wenn die Westsonne mindestens 20 Minuten ausbleibt,
    die Westsonne vorbei ist, es deutlich abgekuehlt hat oder starker Wind auftritt. Ein manueller Override verhindert jede
    automatische Korrektur.
  triggers:
  - trigger: state
    entity_id:
    - sun.sun
    - sensor.weather_station_aussen_temperatur
    - sensor.weather_station_windmesser_windgeschwindigkeit
    - sensor.weather_station_windmesser_boenstarke
  - trigger: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    to: 'off'
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
    state: 'on'
  - condition: state
    entity_id: input_boolean.rollo_west_manuell_override
    state: 'off'
  - condition: template
    value_template: "{% set outside = states('sensor.weather_station_aussen_temperatur') | float(99) %} {% set wind = states('sensor.weather_station_windmesser_windgeschwindigkeit')\
      \ | float(0) %} {% set gust = states('sensor.weather_station_windmesser_boenstarke') | float(0) %} {% set elevation\
      \ = state_attr('sun.sun', 'elevation') | float(-90) %} {% set azimuth = state_attr('sun.sun', 'azimuth') | float(360)\
      \ %} {{ elevation <= 5 or azimuth >= 305 or outside <= 20.5\n  or wind >= 30 or gust >= 45\n  or is_state('binary_sensor.westfenster_direkte_sonne',\
      \ 'off') }}"
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
  - parallel:
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.wohnzimmerfenster_rollo
          zielposition: '{{ states(''input_number.rt_rollo_wohnzimmer_nach_sonnenschutz'') | float(100) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.rollo_schlafzimmer
          zielposition: '{{ states(''input_number.rt_rollo_schlafzimmer_nach_sonnenschutz'') | float(100) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
          zielposition: '{{ states(''input_number.rt_rollo_gaste_wc_nach_sonnenschutz'') | float(100) }}'
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.terrassentur_rollo_rollo_terrassentur
          zielposition: '{{ states(''input_number.rt_rollo_terrasse_nach_sonnenschutz'') | float(100) }}'
  mode: single
- id: '1772142255363'
  alias: Gästezimmer - Decke Erreichbarkeit steuert Dimmer-Profil (ohne Konflikt)
  description: 'Nutzt ausschließlich die Erreichbarkeit der Deckenlampe als Trigger. - Wenn Decke nicht erreichbar (stromlos/unavailable/unknown)
    -> Gruppe aus. - Wenn Decke wieder erreichbar -> setze Zeitprofil (nur wenn Decke ON ist).

    '
  triggers:
  - entity_id: light.gaestezimmer_decke
    to: unavailable
    for: 00:00:05
    id: not_reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    to: unknown
    for: 00:00:05
    id: not_reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    from: unavailable
    for: 00:00:02
    id: reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    from: unknown
    for: 00:00:02
    id: reachable
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: not_reachable
      sequence:
      - action: light.turn_off
        data:
          entity_id: '{{ light_group }}'
          transition: '{{ off_transition }}'
    - conditions:
      - condition: trigger
        id: reachable
      - condition: state
        entity_id: light.gaestezimmer_decke
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: input_datetime.rt_gast_decke_zeit_003000
            before: input_datetime.rt_gast_decke_zeit_070000
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ night_brightness }}'
              color_temp_kelvin: '{{ night_kelvin }}'
              transition: '{{ night_transition }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_gast_decke_zeit_070000
            before: input_datetime.rt_gast_decke_zeit_093000
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ morning_brightness }}'
              color_temp_kelvin: '{{ morning_kelvin }}'
              transition: '{{ morning_transition }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_gast_decke_zeit_093000
            before: input_datetime.rt_gast_decke_zeit_173000
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ day_brightness }}'
              color_temp_kelvin: '{{ day_kelvin }}'
              transition: '{{ day_transition }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_gast_decke_zeit_173000
            before: input_datetime.rt_gast_decke_zeit_220000
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ evening_brightness }}'
              color_temp_kelvin: '{{ evening_kelvin }}'
              transition: '{{ evening_transition }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_gast_decke_zeit_220000
            before: input_datetime.rt_gast_decke_zeit_003000
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ late_brightness }}'
              color_temp_kelvin: '{{ late_kelvin }}'
              transition: '{{ late_transition }}'
  variables:
    light_group: light.gastezimmer_2
    morning_brightness: '{{ states(''input_number.rt_gast_decke_morning_brightness'') | float(60) }}'
    morning_kelvin: '{{ states(''input_number.rt_gast_decke_morning_kelvin'') | float(3800) }}'
    morning_transition: '{{ states(''input_number.rt_gast_decke_morning_transition'') | float(2) }}'
    day_brightness: '{{ states(''input_number.rt_gast_decke_day_brightness'') | float(100) }}'
    day_kelvin: '{{ states(''input_number.rt_gast_decke_day_kelvin'') | float(6000) }}'
    day_transition: '{{ states(''input_number.rt_gast_decke_day_transition'') | float(1) }}'
    evening_brightness: '{{ states(''input_number.rt_gast_decke_evening_brightness'') | float(75) }}'
    evening_kelvin: '{{ states(''input_number.rt_gast_decke_evening_kelvin'') | float(3300) }}'
    evening_transition: '{{ states(''input_number.rt_gast_decke_evening_transition'') | float(2) }}'
    late_brightness: '{{ states(''input_number.rt_gast_decke_late_brightness'') | float(30) }}'
    late_kelvin: '{{ states(''input_number.rt_gast_decke_late_kelvin'') | float(2400) }}'
    late_transition: '{{ states(''input_number.rt_gast_decke_late_transition'') | float(3) }}'
    night_brightness: '{{ states(''input_number.rt_gast_decke_night_brightness'') | float(1) }}'
