  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_1'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['short_release','short_press','press','release']\
          \ }}\n"
      sequence:
