- id: '1771557943974'
  alias: Flur - Licht Motion nach Tageszeit
  description: Schaltet Dekolampe, Flur 1 und Flur 2 bei Bewegung je nach Tageszeit. Der Nachlauf startet erst, wenn beide
    Flur-Bewegungsmelder wieder frei sind.
  triggers:
  - entity_id:
    - binary_sensor.hue_motion_sensor_2_bewegung
    - binary_sensor.hue_motion_sensor_4_bewegung
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - variables:
      motion_sensors:
      - binary_sensor.hue_motion_sensor_2_bewegung
      - binary_sensor.hue_motion_sensor_4_bewegung
      periode: "{% set t = now().strftime('%H:%M') %}\n{% set weekend = now().weekday() in [5, 6] %}\n\n{% if weekend %}\n\
        \  {% if states('input_datetime.rt_flur_zeit_0600')[:5] <= t < states('input_datetime.rt_flur_zeit_0830')[:5] %}\n\
        \    wochenende_frueh\n  {% elif states('input_datetime.rt_flur_zeit_0830')[:5] <= t <= states('input_datetime.rt_flur_zeit_0900')[:5]\
        \ %}\n    morgens\n  {% elif states('input_datetime.rt_flur_zeit_0901')[:5] <= t <= states('input_datetime.rt_flur_zeit_2000')[:5]\
        \ %}\n    tag\n  {% elif states('input_datetime.rt_flur_zeit_2001')[:5] <= t <= states('input_datetime.rt_flur_zeit_2359')[:5]\
        \ %}\n    abends\n  {% else %}\n    nacht\n  {% endif %}\n{% else %}\n  {% if states('input_datetime.rt_flur_zeit_0701')[:5]\
        \ <= t <= states('input_datetime.rt_flur_zeit_0900')[:5] %}\n    morgens\n  {% elif states('input_datetime.rt_flur_zeit_0901')[:5]\
        \ <= t <= states('input_datetime.rt_flur_zeit_2000')[:5] %}\n    tag\n  {% elif states('input_datetime.rt_flur_zeit_2001')[:5]\
        \ <= t <= states('input_datetime.rt_flur_zeit_2359')[:5] %}\n    abends\n  {% else %}\n    nacht\n  {% endif %}\n\
        {% endif %}"
      transition_seconds: "{% set p = periode | trim %}\n{% if p == 'nacht' %}\n  {{ states('input_number.rt_flur_uebergang_nacht')\
        \ | float(2) }}\n{% elif p == 'tag' %}\n  {{ states('input_number.rt_flur_uebergang_tag') | float(0.5) }}\n{% else\
        \ %}\n  {{ states('input_number.rt_flur_uebergang_sonst') | float(1) }}\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ periode | trim == ''nacht'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dekolampe
        data:
          brightness_pct: '{{ states(''input_number.rt_flur_helligkeit_30'') | float(30) }}'
          transition: '{{ transition_seconds | float }}'
      - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
        continue_on_timeout: false
      - delay:
          seconds: '{{ states(''input_number.rt_flur_nachlauf_30'') | float(30) }}'
      - condition: template
        value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
      - action: light.turn_off
        target:
          entity_id:
          - light.dekolampe
        data:
          transition: '{{ transition_seconds | float }}'
    - conditions:
      - condition: template
        value_template: '{{ periode | trim == ''wochenende_frueh'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dekolampe
        data:
          brightness_pct: '{{ states(''input_number.rt_flur_helligkeit_45'') | float(45) }}'
          transition: '{{ transition_seconds | float }}'
      - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
        continue_on_timeout: false
      - delay:
          seconds: '{{ states(''input_number.rt_flur_nachlauf_30'') | float(30) }}'
      - condition: template
        value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
      - action: light.turn_off
        target:
          entity_id:
          - light.dekolampe
        data:
          transition: '{{ transition_seconds | float }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''morgens'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.dekolampe
            - light.flur_1
            - light.flur_2
          data:
            brightness_pct: '{{ states(''input_number.rt_flur_helligkeit_65'') | float(65) }}'
            transition: '{{ transition_seconds | float }}'
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''tag'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.dekolampe
            - light.flur_1
            - light.flur_2
          data:
            brightness_pct: '{{ states(''input_number.rt_flur_helligkeit_90'') | float(90) }}'
            transition: '{{ transition_seconds | float }}'
      default:
      - action: light.turn_on
        target:
          entity_id:
          - light.dekolampe
          - light.flur_1
          - light.flur_2
        data:
          brightness_pct: '{{ states(''input_number.rt_flur_helligkeit_45'') | float(45) }}'
          transition: '{{ transition_seconds | float }}'
    - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
      continue_on_timeout: false
    - delay:
        seconds: '{{ states(''input_number.rt_flur_nachlauf_60'') | float(60) }}'
    - condition: template
      value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
    - action: light.turn_off
      target:
        entity_id:
        - light.dekolampe
        - light.flur_1
        - light.flur_2
      data:
        transition: '{{ transition_seconds | float }}'
  mode: restart
- id: '1771732921087'
  alias: Hue Dimmer Remote Kueche
  description: ''
  triggers:
  - entity_id:
    - event.hue_dimmer_switch_kuche_taste_1
    - event.hue_dimmer_switch_kuche_taste_2
    - event.hue_dimmer_switch_kuche_taste_3
    - event.hue_dimmer_switch_kuche_taste_4
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_1'') }}'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: input_datetime.rt_kuche_dimmer_zeit_060000
            before: input_datetime.rt_kuche_dimmer_zeit_093000
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_morning }}'
              color_temp_kelvin: '{{ k_warm }}'
              transition: '{{ tr_on }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_kuche_dimmer_zeit_093000
            before: input_datetime.rt_kuche_dimmer_zeit_200000
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_day }}'
              color_temp_kelvin: '{{ k_day }}'
              transition: '{{ tr_on }}'
        - conditions:
          - condition: time
            after: input_datetime.rt_kuche_dimmer_zeit_200000
            before: input_datetime.rt_kuche_dimmer_zeit_233000
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_evening }}'
              color_temp_kelvin: '{{ k_warm }}'
              transition: '{{ tr_on }}'
        default:
        - action: light.turn_on
          target:
            entity_id: '{{ light_target }}'
          data:
            brightness_pct: '{{ b_night }}'
            hs_color: '{{ hs_night }}'
            transition: '{{ tr_on }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_2'') and trigger.to_state.attributes.event_type == ''short_release''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_target }}'
        data:
          brightness_step_pct: '{{ step_pct }}'
          transition: '{{ tr_step }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_3'') and trigger.to_state.attributes.event_type == ''short_release''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_target }}'
        data:
          brightness_step_pct: '{{ 0 - step_pct }}'
          transition: '{{ tr_step }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_4'') }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ light_target }}'
        data:
          transition: '{{ tr_off }}'
  mode: restart
  variables:
    light_target: light.kuche_2
    b_morning: '{{ states(''input_number.rt_kuche_dimmer_b_morning'') | float(60) }}'
    b_day: '{{ states(''input_number.rt_kuche_dimmer_b_day'') | float(100) }}'
    b_evening: '{{ states(''input_number.rt_kuche_dimmer_b_evening'') | float(75) }}'
    b_night: '{{ states(''input_number.rt_kuche_dimmer_b_night'') | float(10) }}'
    k_warm: '{{ states(''input_number.rt_kuche_dimmer_k_warm'') | float(2300) }}'
    k_day: '{{ states(''input_number.rt_kuche_dimmer_k_day'') | float(6000) }}'
    k_clean: 6000
    hs_night:
    - '{{ states(''input_number.rt_kuche_nacht_hue'') | float(220) }}'
    - '{{ states(''input_number.rt_kuche_nacht_saturation'') | float(90) }}'
    tr_on: '{{ states(''input_number.rt_kuche_dimmer_tr_on'') | float(2) }}'
    tr_off: '{{ states(''input_number.rt_kuche_dimmer_tr_off'') | float(3) }}'
    tr_step: '{{ states(''input_number.rt_kuche_dimmer_tr_step'') | float(1) }}'
    step_pct: '{{ states(''input_number.rt_kuche_dimmer_step_pct'') | float(10) }}'
- id: '1771742860013'
  alias: Hue Dimmer Wohnzimmer - Decke + Orange + Küche/Esszimmer Aus
