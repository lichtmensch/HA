  - type: markdown
    content: '## Wohnzimmer-Dimmer

      Dieser Schalter hat feste Kurz-/Langdruckprofile.


      **Taste 1 kurz:** Decke {{ states(''input_number.rt_wohnzimmer_kurz_decke'') | int }} % / {{ states(''input_number.rt_wohnzimmer_kurz_kelvin'')
      | int }} K + Ambientelicht {{ states(''input_number.rt_wohnzimmer_kurz_ambient'') | int }} % in Orange.


      **Taste 1 lang:** {{ states(''input_number.rt_wohnzimmer_lang_helligkeit'') | int }} % / {{ states(''input_number.rt_wohnzimmer_warmweiss_kelvin'')
      | int }} K.


      **Taste 2/3 kurz:** dimmen. **Taste 4 kurz:** Wohnzimmer aus. **Taste 4 lang:** Küche und Esszimmer aus. Zeitprofile
      für Wohnzimmer/Esszimmer gehören zum separaten Kühlschrank-Schalter auf Hue.'
  - type: markdown
    content: '## Küchenschalter

