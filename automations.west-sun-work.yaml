- id: '1785008192931'
  alias: Küche - Licht Motion nach Tageszeit
  initial_state: false
  description: Schaltet die Küchenlampen bei Bewegung je nach Tageszeit mit passender
    Lichtfarbe. Der Nachlauf startet, sobald der Küchen-Bewegungsmelder wieder frei
    ist.
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_3_bewegung
    to: 'on'
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_3_beleuchtungsstarke
    below: 30
  actions:
  - variables:
      motion_sensors:
      - binary_sensor.hue_motion_sensor_3_bewegung
      periode: "{% set t = now().strftime('%H:%M') %} {% if '07:01' <= t <= '09:00'
        %}\n  morgens\n{% elif '09:01' <= t <= '20:00' %}\n  tag\n{% elif '20:01'
        <= t <= '23:59' %}\n  abends\n{% else %}\n  nacht\n{% endif %}"
      transition_seconds: "{% set p = periode | trim %} {% if p == 'nacht' %}\n  2\n{%
        elif p == 'tag' %}\n  0.5\n{% else %}\n  1\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ periode | trim == ''nacht'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kuche_2
        data:
          brightness_pct: 30
          hs_color:
          - 220
          - 90
          transition: '{{ transition_seconds | float }}'
      - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq',
          'on')\n   | list\n   | count == 0 }}"
        continue_on_timeout: false
      - delay:
          seconds: 30
      - condition: template
        value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq',
          'on')\n   | list\n   | count == 0 }}"
      - action: light.turn_off
        target:
          entity_id: light.kuche_2
        data:
          transition: '{{ transition_seconds | float }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''morgens'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.kuche_2
          data:
            brightness_pct: 65
            color_temp_kelvin: 3200
            transition: '{{ transition_seconds | float }}'
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''tag'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.kuche_2
          data:
            brightness_pct: 90
            color_temp_kelvin: 4000
            transition: '{{ transition_seconds | float }}'
      default:
      - action: light.turn_on
        target:
          entity_id: light.kuche_2
        data:
          brightness_pct: 45
          color_temp_kelvin: 2300
          transition: '{{ transition_seconds | float }}'
    - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n
        \  | list\n   | count == 0 }}"
      continue_on_timeout: false
    - delay:
        minutes: 1
    - condition: template
      value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n
        \  | list\n   | count == 0 }}"
    - action: light.turn_off
      target:
        entity_id: light.kuche_2
      data:
        transition: '{{ transition_seconds | float }}'
  mode: restart
- id: '1785008784986'
  alias: Küche - Bewegungslicht manueller Vorrang
  description: Deaktiviert die Küchen-Bewegungsautomation bei manuellem Einschalten
    über Taste 1. Taste 4 stoppt einen laufenden Nachlauf, setzt ihn zurück und aktiviert
    die Bewegungsautomation nach dem manuellen Ausschalten wieder.
  triggers:
  - entity_id:
    - event.hue_dimmer_switch_kuche_taste_1
    - event.hue_dimmer_switch_kuche_taste_4
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_1'') }}'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.kuche_licht_motion_nach_tageszeit_2
        data:
          stop_actions: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_4'') }}'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.kuche_licht_motion_nach_tageszeit_2
        data:
          stop_actions: true
      - action: automation.turn_on
        target:
          entity_id: automation.kuche_licht_motion_nach_tageszeit_2
  mode: restart
- id: '1785351803641'
  alias: Terrasse - Personenalarm bei Abwesenheit
  description: Sendet Timo und Selina eine Push-Nachricht, wenn beide nicht zu Hause
    sind und auf der Terrasse eine Person erkannt wird.
  triggers:
  - trigger: state
    entity_id: binary_sensor.terrasse_person
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ states(''person.timo_weinhold'') not in [''home'', ''unknown'',
      ''unavailable''] and states(''person.selina'') not in [''home'', ''unknown'',
      ''unavailable''] }}'
  actions:
  - action: persistent_notification.create
    data:
      title: Person auf der Terrasse
      message: Während eurer Abwesenheit wurde auf der Terrasse eine Person erkannt.
        [Kamerabild öffnen](/api/camera_proxy/camera.192_168_188_108_2)
      notification_id: terrasse_personenalarm_abwesenheit
  - action: notify.mobile_app_timos_iphone15_pro_max
    data:
      title: Person auf der Terrasse
      message: Auf der Terrasse wurde eine Person erkannt.
      data:
        image: /api/camera_proxy/camera.192_168_188_108_2
  - action: notify.mobile_app_seli_iphone
    data:
      title: Person auf der Terrasse
      message: Auf der Terrasse wurde eine Person erkannt.
      data:
        image: /api/camera_proxy/camera.192_168_188_108_2
  mode: single
- id: '1785352407181'
  alias: Terrasse - Kritischer Nachtalarm
  description: Sendet Timo zwischen 01:00 und 05:00 Uhr einen kritischen iPhone-Alarm,
    wenn auf der Terrasse eine Person erkannt wird.
  triggers:
  - trigger: state
    entity_id: binary_sensor.terrasse_person
    to: 'on'
  conditions:
  - condition: time
    after: 01:00:00
    before: 05:00:00
  actions:
  - action: persistent_notification.create
    data:
      title: 'KRITISCH: Person auf der Terrasse'
      message: Zwischen 01:00 und 05:00 Uhr wurde eine Person auf der Terrasse erkannt.
        [Kamerabild öffnen](/api/camera_proxy/camera.192_168_188_108_2)
      notification_id: terrasse_kritischer_nachtalarm
  - action: notify.mobile_app_timos_iphone15_pro_max
    data:
      title: 'KRITISCH: Person auf der Terrasse'
      message: Zwischen 01:00 und 05:00 Uhr wurde eine Person auf der Terrasse erkannt.
      data:
        image: /api/camera_proxy/camera.192_168_188_108_2
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
