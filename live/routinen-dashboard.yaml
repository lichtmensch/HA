      | Profil | Zeit | Helligkeit / Farbe |

      |---|---|---|

      | Morgen | {{ states(''input_datetime.rt_kuche_dimmer_zeit_060000'')[:5] }}–{{ states(''input_datetime.rt_kuche_dimmer_zeit_093000'')[:5]
