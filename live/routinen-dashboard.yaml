  - &id001
    type: markdown
    content: '### Schlafzimmer Bett · Hue-Bridge

      Stand: 04.10.2026. Bestehende Hue-Regeln, hier zunächst als Übersicht.


      | Ab | Räume / Szenen |

      |---|---|

      | 07:00 | Schlafzimmer · Energie tanken |

      | 10:00 | Schlafzimmer · Konzentrieren |

      | 17:00 | Schlafzimmer · Lesen |

      | 20:00 | Schlafzimmer · Entspannen |

      | 23:00 | Schlafzimmer · Nachtlicht |


      Das letzte Profil gilt über Mitternacht bis zum nächsten Eintrag. Die Szene wird durch den Tastendruck ausgewählt, nicht
      automatisch zur Uhrzeit gestartet.


      **Zum nächsten Tastendruck gilt aktuell:** {% set t=now().strftime(''%H:%M'') %}{{ ''Energie tanken'' if ''07:00'' <=
      t < ''10:00'' else ''Konzentrieren'' if ''10:00'' <= t < ''17:00'' else ''Lesen'' if ''17:00'' <= t < ''20:00'' else
      ''Entspannen'' if ''20:00'' <= t < ''23:00'' else ''Nachtlicht'' }}'
  - &id002
    type: markdown
    content: '### Hue dimmer switch Kühlschrank · Hue-Bridge

      Stand: 04.10.2026. Bestehende Hue-Regeln, hier zunächst als Übersicht.


      | Ab | Räume / Szenen |

      |---|---|

      | 07:00 | Wohnzimmer · Energie tanken; Esszimmer · Hell |

      | 10:00 | Wohnzimmer · Konzentrieren; Esszimmer · Hell |

      | 17:00 | Wohnzimmer · Lesen; Esszimmer · Hell |

      | 20:00 | Wohnzimmer · Entspannen; Esszimmer · Gedimmt |

      | 23:00 | Wohnzimmer · Nachtlicht; Esszimmer · Nachtlicht |


      Das letzte Profil gilt über Mitternacht bis zum nächsten Eintrag. Die Szene wird durch den Tastendruck ausgewählt, nicht
      automatisch zur Uhrzeit gestartet.


      **Zum nächsten Tastendruck gilt aktuell:** {% set t=now().strftime(''%H:%M'') %}{{ ''Energie tanken / Hell'' if ''07:00''
      <= t < ''10:00'' else ''Konzentrieren / Hell'' if ''10:00'' <= t < ''17:00'' else ''Lesen / Hell'' if ''17:00'' <= t
      < ''20:00'' else ''Entspannen / Gedimmt'' if ''20:00'' <= t < ''23:00'' else ''Nachtlicht / Nachtlicht'' }}'
  - type: vertical-stack
    cards:
    - &id003
      type: markdown
      content: '## QNAP · UniFi-Wochenprüfung


        **Jeden Sonntag um {{ states("input_datetime.qnap_unifi_pruefzeit")[:5] }} Uhr.**


        QNAP per Wake-on-LAN starten → Controller abwarten → gemeldete Firmware-/Controller-Updates lesen → ohne Updates geordnet
        herunterfahren. Mit Updates bleibt die QNAP eingeschaltet und informiert Timos iPhone. Keine Update-Installation.


        Bei nicht erfolgreicher Prüfung wird nicht heruntergefahren; stattdessen wird ein Fehler gemeldet. Der vorhandene
        UniFi-Lesezugang wird beibehalten; eine erzwungene neue Firmware-Suche ist damit nicht erlaubt.


        Der NAS-/Controller-Start kann mehrere Minuten dauern. Der Ablauf wartet bis zu 20 Minuten auf prüfbare Update-Daten.'
