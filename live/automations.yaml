          hs_color: '{{ deep_orange_hs }}'
          transition: '{{ transition_s }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_1'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['long_release','long_press','hold','repeat'] }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ decke_lampen }}'
        data:
          brightness_pct: '{{ states(''input_number.rt_wohnzimmer_lang_helligkeit'') | float(100) }}'
          color_temp_kelvin: '{{ warmweiss_kelvin }}'
          transition: '{{ transition_s }}'
      - action: light.turn_on
        target:
          entity_id:
          - light.hue_play_gradient_lightstrip_1
          - light.hue_color_floor_1
        data:
          brightness_pct: '{{ states(''input_number.rt_wohnzimmer_lang_helligkeit'') | float(100) }}'
          color_temp_kelvin: '{{ warmweiss_kelvin }}'
          transition: '{{ transition_s }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_2'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['short_release','short_press','press','release']\
          \ }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ dimm_lampen }}'
        data:
          brightness_step_pct: '{{ (states(''input_number.rt_wohnzimmer_dimmschritt'') | float(10)) }}'
          transition: '{{ dim_transition_s }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_3'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['short_release','short_press','press','release']\
          \ }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ dimm_lampen }}'
        data:
          brightness_step_pct: '{{ -(states(''input_number.rt_wohnzimmer_dimmschritt'') | float(10)) }}'
          transition: '{{ dim_transition_s }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_4'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['short_release','short_press','press','release']\
          \ }}\n"
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.hue_filament_bulb_1
          - light.hue_filament_bulb_2
          - light.hue_filament_bulb_3
          - light.hue_play_gradient_lightstrip_1
          - light.hue_color_floor_1
        data:
          transition: '{{ off_transition_s }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''event.hue_dimmer_switch_wohnzimmer_taste_4'' }}

          '
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type in\n   ['long_release','long_press','hold','repeat'] }}\n"
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.kuche
          - light.esszimmer
        data:
          transition: '{{ off_transition_s }}'
  mode: single
  variables:
    transition_s: '{{ states(''input_number.rt_wohnzimmer_transition_s'') | float(1.5) }}'
    dim_transition_s: '{{ states(''input_number.rt_wohnzimmer_dim_transition_s'') | float(0.4) }}'
    off_transition_s: '{{ states(''input_number.rt_wohnzimmer_off_transition_s'') | float(0.8) }}'
    warmweiss_kelvin: '{{ states(''input_number.rt_wohnzimmer_warmweiss_kelvin'') | float(2700) }}'
