# Official n-tv top-news RSS feed. Only the dashboard displays the headlines.
rest:
  - resource: https://www.n-tv.de/rss
    scan_interval: 900
    timeout: 20
    sensor:
      - name: NTV Nachrichten
        unique_id: ntv_nachrichten_rss_v1
        icon: mdi:newspaper-variant-outline
        device_class: timestamp
        value_template: "{{ now().isoformat() }}"
        json_attributes_path: "$.rss.channel.item[0]"
        json_attributes:
          - title
          - link
          - pubDate
      - name: NTV Nachricht 2
