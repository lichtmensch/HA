template:
- sensor:
  - name: Routinen Flur Periode
    unique_id: routinen_flur_periode
    state: "{% set t = now().strftime('%H:%M') %}\n{% set weekend = now().weekday() in [5, 6] %}\n\n{% if weekend %}\n  {%\
      \ if states('input_datetime.rt_flur_zeit_0600')[:5] <= t < states('input_datetime.rt_flur_zeit_0830')[:5] %}\n    wochenende_frueh\n\
      \  {% elif states('input_datetime.rt_flur_zeit_0830')[:5] <= t <= states('input_datetime.rt_flur_zeit_0900')[:5] %}\n\
      \    morgens\n  {% elif states('input_datetime.rt_flur_zeit_0901')[:5] <= t <= states('input_datetime.rt_flur_zeit_2000')[:5]\
      \ %}\n    tag\n  {% elif states('input_datetime.rt_flur_zeit_2001')[:5] <= t <= states('input_datetime.rt_flur_zeit_2359')[:5]\
      \ %}\n    abends\n  {% else %}\n    nacht\n  {% endif %}\n{% else %}\n  {% if states('input_datetime.rt_flur_zeit_0701')[:5]\
      \ <= t <= states('input_datetime.rt_flur_zeit_0900')[:5] %}\n    morgens\n  {% elif states('input_datetime.rt_flur_zeit_0901')[:5]\
      \ <= t <= states('input_datetime.rt_flur_zeit_2000')[:5] %}\n    tag\n  {% elif states('input_datetime.rt_flur_zeit_2001')[:5]\
      \ <= t <= states('input_datetime.rt_flur_zeit_2359')[:5] %}\n    abends\n  {% else %}\n    nacht\n  {% endif %}\n{%\
      \ endif %}"
    icon: mdi:clock-outline
  - name: Routinen Gästezimmer Dimmer Periode
    unique_id: routinen_1772158332905_periode
    state: '{% set t = now().strftime("%H:%M:%S") %}

      {% if ((states(''input_datetime.rt_gast_dimmer_zeit_233000'') <= t < states(''input_datetime.rt_gast_dimmer_zeit_070000''))
      if states(''input_datetime.rt_gast_dimmer_zeit_233000'') < states(''input_datetime.rt_gast_dimmer_zeit_070000'') else
