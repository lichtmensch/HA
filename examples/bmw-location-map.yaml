    angenommen') %} Letzte GPS-Position innerhalb von 50 m; seit mindestens 5 Minuten
    keine neue Position. {% elif is_state('sensor.bmw_ix1_kartenposition','Unbekannt')
    %} Noch keine gültige Fahrzeugposition gespeichert. {% endif %}
