- id: '1773104281445'
  alias: System - Batterie kritisch
  description: Meldet echte, nicht wiederaufladbare Hausgeräte-Batterien einmalig beim Unterschreiten von 5%
  triggers:
  - event_type: state_changed
    trigger: event
  conditions:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data.entity_id | default('') | lower %}
      {% set old = trigger.event.data.old_state %}
      {% set new = trigger.event.data.new_state %}
      {% set excluded = 'iphone' in e or 'ipad' in e or 'watch' in e
        or 'macbook' in e or 'wby' in e or 'ix1' in e
        or 'state_of_charge' in e or 'robotic_vacuum' in e or 's8_maxv' in e %}
      {% if not new or not e.startswith('sensor.') or excluded %}
        false
      {% else %}
        {% set unit = state_attr(e, 'unit_of_measurement') %}
        {% set device_class = state_attr(e, 'device_class') %}
        {% set new_value = new.state | float(-1) %}
        {% set old_value = old.state | float(101) if old else 101 %}
        {{ device_class == 'battery' and unit == '%' and new_value >= 0
          and new_value <= 5 and old_value > 5 }}
      {% endif %}
  actions:
  - action: notify.mobile_app_timos_iphone15_pro_max
    data:
      title: Batterie kritisch
      message: >-
        {{ trigger.event.data.new_state.name }} hat nur noch
        {{ trigger.event.data.new_state.state | int }} % Batterie.
      data:
        tag: ha_battery_critical_{{ trigger.event.data.entity_id }}
        group: home_assistant_system
  mode: queued
  max: 10
- id: '1773105110856'
  alias: System - Shelly Rollo Fehlerwarnung
  description: Meldet generisch Fehler bei Shelly Rollos
  triggers:
  - event_type: state_changed
    trigger: event
  conditions:
  - condition: template
    value_template: "{% set e = trigger.event.data.entity_id | default('') %} {% set
      ns = trigger.event.data.new_state %} {% if not ns %}\n  false\n{% else %}\n
      \ {{\n    ns.state == 'on'\n    and e.startswith('binary_sensor.')\n    and
      (\n      'uberhitzung' in e\n      or 'uberlast' in e\n      or 'uberspannung'
      in e\n      or 'uberstrom' in e\n      or 'neustart_erforderlich' in e\n    )\n
      \   and (\n      'rollo' in e\n      or 'wohnzimmerfenster' in e\n      or 'terrassentur'
      in e\n      or 'shelly2pmg3_' in e\n    )\n  }}\n{% endif %}\n"
  actions:
  - data:
      title: Home Assistant – Shelly Fehler
      message: '{{ trigger.event.data.new_state.name }} wurde ausgelöst ({{ trigger.event.data.entity_id
        }}).

        '
    action: notify.mobile_app_timos_iphone15_pro_max
  - data:
      title: Shelly Fehler
      message: '{{ trigger.event.data.new_state.name }} hat einen Fehler gemeldet.
        Entity: {{ trigger.event.data.entity_id }}

        '
    action: persistent_notification.create
  mode: queued
  max: 20
