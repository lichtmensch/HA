- id: hue_langdruck_rollo_schlafzimmer_20260926
  alias: Hue Dimmer - Schlafzimmer-Rollo per Langdruck
  description: Taste 2 lange = Morgenposition 87 Prozent, Taste 3 lange = Abendposition 25 Prozent.
  triggers:
  - trigger: state
    entity_id:
    - event.schlafzimmer_bett_taste_2
    - event.schlafzimmer_bett_taste_3
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.attributes.event_type == ''long_press'' }}'
  actions:
  - action: cover.set_cover_position
    target:
      entity_id: cover.rollo_schlafzimmer
    data:
      position: '{{ (states(''input_number.rt_rollo_schlafzimmer_morgen'') | float(87)) if trigger.entity_id.endswith(''_taste_2'')
        else (states(''input_number.rt_rollo_schlafzimmer_abend'') | float(25)) }}'
  mode: restart
- id: hue_kurzdruck_dimmen_schlafzimmer_20260926
  alias: Hue Dimmer - Schlafzimmer kurz dimmen
  description: Kurzer Druck auf Taste 2 oder 3 dimmt das Schlafzimmer; langer Druck bleibt für das Rollo reserviert.
  triggers:
  - trigger: state
    entity_id:
    - event.schlafzimmer_bett_taste_2
    - event.schlafzimmer_bett_taste_3
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.attributes.event_type == ''short_release'' }}'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.schlafzimmer
    data:
      brightness_step: '{{ 25 if trigger.entity_id.endswith(''_taste_2'') else -25 }}'
      transition: 0.4
  mode: queued
  max: 5
- id: hue_langdruck_rollo_gastezimmer_20260926
  alias: Hue Dimmer - Gästezimmer-Rollo per Langdruck
  description: Taste 2 lange = Morgenposition 100 Prozent, Taste 3 lange = Abendposition 25 Prozent.
  triggers:
  - trigger: state
    entity_id:
    - event.hue_dimmer_switch_gastezimmer_taste_2
    - event.hue_dimmer_switch_gastezimmer_taste_3
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.attributes.event_type == ''long_press'' }}'
  actions:
  - action: cover.set_cover_position
    target:
      entity_id: cover.shelly2pmg3_8cbfea9a6bb0_rollo_gastezimmer
    data:
      position: '{{ (states(''input_number.rt_rollo_gastezimmer_morgen'') | float(100)) if trigger.entity_id.endswith(''_taste_2'')
        else (states(''input_number.rt_rollo_gastezimmer_abend'') | float(25)) }}'
  mode: restart
