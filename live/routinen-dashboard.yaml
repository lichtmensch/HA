        **Abends:** Sonnenuntergang +30 Minuten → Abendpositionen.


        **Mo–Fr:** ab {{ states(''input_datetime.rt_rollo_weekday_0700'')[:5] }} und Sonnenaufgang +30 Min.; Schlafzimmer/Gästezimmer
        {{ states(''input_datetime.rt_rollo_weekday_1000'')[:5] }}.


        **Wochenende:** ab {{ states(''input_datetime.rt_rollo_weekend_0830'')[:5] }} und Sonnenaufgang +60 Min.; Schlafzimmer/Gästezimmer
        {{ states(''input_datetime.rt_rollo_weekend_1100'')[:5] }}.


        **Schlafzimmer morgens:** {{ states(''input_number.rt_rollo_schlafzimmer_morgen'') | int }} %. Sonnenschutz bleibt
        mit eigenen Zielwerten und manuellem Vorrang verknüpft.'
