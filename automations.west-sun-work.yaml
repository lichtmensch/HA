              transition: '{{ night_transition }}'
        - conditions:
          - condition: time
            after: 07:00:00
            before: 09:30:00
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ morning_brightness }}'
              color_temp_kelvin: '{{ morning_kelvin }}'
              transition: '{{ morning_transition }}'
        - conditions:
          - condition: time
            after: 09:30:00
            before: '17:30:00'
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ day_brightness }}'
              color_temp_kelvin: '{{ day_kelvin }}'
              transition: '{{ day_transition }}'
        - conditions:
          - condition: time
            after: '17:30:00'
            before: '20:30:00'
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ evening_brightness }}'
              color_temp_kelvin: '{{ evening_kelvin }}'
              transition: '{{ evening_transition }}'
        - conditions:
          - condition: time
            after: '20:30:00'
            before: '23:30:00'
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ late_brightness }}'
              color_temp_kelvin: '{{ late_kelvin }}'
              transition: '{{ late_transition }}'
    - conditions:
      - condition: trigger
        id: on_long
      sequence:
      - action: light.turn_on
        data:
          entity_id: '{{ light_group }}'
          brightness_pct: 100
          color_temp_kelvin: 4000
          transition: 2
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        data:
          entity_id: '{{ light_group }}'
          transition: '{{ off_transition }}'
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_group }}'
        data:
          brightness_step_pct: '{{ step_pct }}'
          transition: '{{ step_transition }}'
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_group }}'
        data:
          brightness_step_pct: '{{ 0 - step_pct }}'
          transition: '{{ step_transition }}'
  variables:
    light_group: light.gastezimmer_2
    morning_brightness: 60
    morning_kelvin: 3800
    morning_transition: 2
    day_brightness: 100
    day_kelvin: 6000
    day_transition: 1
    evening_brightness: 75
    evening_kelvin: 3300
    evening_transition: 2
    late_brightness: 5
    late_kelvin: 2400
    late_transition: 3
    night_brightness: 1
    night_kelvin: 2400
    night_transition: 2
    off_transition: 1
    step_pct: 10
    step_transition: 0.4
  mode: restart
