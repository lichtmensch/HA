- id: '1785008192931'
  alias: Küche - Licht Motion nach Tageszeit
  initial_state: false
  description: Schaltet die Küchenlampen bei Bewegung je nach Tageszeit mit passender Lichtfarbe. Der Nachlauf startet, sobald
    der Küchen-Bewegungsmelder wieder frei ist.
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_3_bewegung
    to: 'on'
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_3_beleuchtungsstarke
    below: 30
  actions:
  - variables:
      motion_sensors:
      - binary_sensor.hue_motion_sensor_3_bewegung
      periode: "{% set t = now().strftime('%H:%M') %} {% if '07:01' <= t <= '09:00' %}\n  morgens\n{% elif '09:01' <= t <=\
        \ '20:00' %}\n  tag\n{% elif '20:01' <= t <= '23:59' %}\n  abends\n{% else %}\n  nacht\n{% endif %}"
      transition_seconds: "{% set p = periode | trim %} {% if p == 'nacht' %}\n  2\n{% elif p == 'tag' %}\n  0.5\n{% else\
        \ %}\n  1\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ periode | trim == ''nacht'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kuche_2
        data:
          brightness_pct: 30
          hs_color:
          - 220
          - 90
          transition: '{{ transition_seconds | float }}'
      - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
        continue_on_timeout: false
      - delay:
          seconds: 30
      - condition: template
        value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
      - action: light.turn_off
        target:
          entity_id: light.kuche_2
        data:
          transition: '{{ transition_seconds | float }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''morgens'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.kuche_2
          data:
            brightness_pct: 65
            color_temp_kelvin: 3200
            transition: '{{ transition_seconds | float }}'
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''tag'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.kuche_2
          data:
            brightness_pct: 90
            color_temp_kelvin: 4000
            transition: '{{ transition_seconds | float }}'
      default:
      - action: light.turn_on
        target:
          entity_id: light.kuche_2
        data:
          brightness_pct: 45
          color_temp_kelvin: 2300
          transition: '{{ transition_seconds | float }}'
    - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
      continue_on_timeout: false
    - delay:
        minutes: 1
    - condition: template
      value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n   | list\n   | count == 0 }}"
    - action: light.turn_off
      target:
        entity_id: light.kuche_2
      data:
        transition: '{{ transition_seconds | float }}'
  mode: restart
- id: '1785008784986'
  alias: Küche - Bewegungslicht manueller Vorrang
