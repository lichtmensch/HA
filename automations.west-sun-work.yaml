- id: '1771746410073'
  alias: Rollos - Sonnenschutz Westseite intelligent
  description: >-
    Faehrt die Westrollos auf 40 %, wenn Westsonne und Waermebedarf
    zusammentreffen. Beruecksichtigt Raumtemperaturen, Tagesprognose,
    den Sonnensensor am Westfenster, Regen und Wind. Direkte Sonne muss
    mindestens drei Minuten anliegen. Manuelle Eingriffe bleiben geschuetzt.
  triggers:
  - trigger: state
    entity_id:
    - sun.sun
    - sensor.weather_station_aussen_temperatur
    - sensor.weather_station_temperatur
    - sensor.weather_station_schlafzimmer_temperatur
    - sensor.weather_station_gastezimmer_temperatur
    - sensor.wetter_heute_temperatur_max
    - sensor.weather_station_windmesser_windgeschwindigkeit
    - sensor.weather_station_windmesser_boenstarke
    - sensor.weather_station_regenmesser_niederschlagsmenge_letzte_stunde
    - weather.forecast_home
  - trigger: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    to: 'on'
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.rollo_west_manuell_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
    state: 'off'
  - condition: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    state: 'on'
  - condition: template
    value_template: >-
      {% set outside = states('sensor.weather_station_aussen_temperatur') | float(-99) %}
      {% set living = states('sensor.weather_station_temperatur') | float(-99) %}
      {% set bedroom = states('sensor.weather_station_schlafzimmer_temperatur') | float(-99) %}
      {% set guest = states('sensor.weather_station_gastezimmer_temperatur') | float(-99) %}
      {% set forecast_max = states('sensor.wetter_heute_temperatur_max') | float(-99) %}
      {% set wind = states('sensor.weather_station_windmesser_windgeschwindigkeit') | float(0) %}
      {% set gust = states('sensor.weather_station_windmesser_boenstarke') | float(0) %}
      {% set rain = states('sensor.weather_station_regenmesser_niederschlagsmenge_letzte_stunde') | float(0) %}
      {% set elevation = state_attr('sun.sun', 'elevation') | float(-90) %}
      {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
      {{ outside > 22
        and (living >= 24 or bedroom >= 24 or guest >= 24 or forecast_max >= 26)
        and elevation > 10 and 240 < azimuth < 300
        and rain <= 0.1 and wind < 30 and gust < 45 }}
  actions:
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.wohnzimmerfenster_rollo
      - cover.rollo_schlafzimmer
      - cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
      - cover.terrassentur_rollo_rollo_terrassentur
    data:
      position: 40
  - delay: 00:00:05
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
  mode: single
- id: '1788540000001'
  alias: Rollos - Sonnenschutz Westseite automatisch beenden
  description: >-
    Oeffnet nur automatisch beschattete Westrollos wieder, wenn die Westsonne
    mindestens 20 Minuten ausbleibt, die Westsonne vorbei ist, es deutlich
    abgekuehlt hat oder starker Wind auftritt. Ein manueller Override verhindert
    jede automatische Korrektur.
  triggers:
  - trigger: state
    entity_id:
    - sun.sun
    - sensor.weather_station_aussen_temperatur
    - sensor.weather_station_windmesser_windgeschwindigkeit
    - sensor.weather_station_windmesser_boenstarke
  - trigger: state
    entity_id: binary_sensor.westfenster_direkte_sonne
    to: 'off'
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
    state: 'on'
  - condition: state
    entity_id: input_boolean.rollo_west_manuell_override
    state: 'off'
  - condition: template
    value_template: >-
      {% set outside = states('sensor.weather_station_aussen_temperatur') | float(99) %}
      {% set wind = states('sensor.weather_station_windmesser_windgeschwindigkeit') | float(0) %}
      {% set gust = states('sensor.weather_station_windmesser_boenstarke') | float(0) %}
      {% set elevation = state_attr('sun.sun', 'elevation') | float(-90) %}
      {% set azimuth = state_attr('sun.sun', 'azimuth') | float(360) %}
      {{ elevation <= 5 or azimuth >= 305 or outside <= 20.5
        or wind >= 30 or gust >= 45
        or is_state('binary_sensor.westfenster_direkte_sonne', 'off') }}
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.rollo_west_sonnenschutz_aktiv
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.wohnzimmerfenster_rollo
      - cover.rollo_schlafzimmer
      - cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
      - cover.terrassentur_rollo_rollo_terrassentur
    data:
      position: 100
  mode: single
- id: '1772142255363'
  alias: Gästezimmer - Decke Erreichbarkeit steuert Dimmer-Profil (ohne Konflikt)
  description: 'Nutzt ausschließlich die Erreichbarkeit der Deckenlampe als Trigger.
    - Wenn Decke nicht erreichbar (stromlos/unavailable/unknown) -> Gruppe aus. -
    Wenn Decke wieder erreichbar -> setze Zeitprofil (nur wenn Decke ON ist).

    '
  triggers:
  - entity_id: light.gaestezimmer_decke
    to: unavailable
    for: 00:00:05
    id: not_reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    to: unknown
    for: 00:00:05
    id: not_reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    from: unavailable
    for: 00:00:02
    id: reachable
    trigger: state
  - entity_id: light.gaestezimmer_decke
    from: unknown
    for: 00:00:02
    id: reachable
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: not_reachable
      sequence:
      - action: light.turn_off
        data:
          entity_id: '{{ light_group }}'
          transition: '{{ off_transition }}'
    - conditions:
      - condition: trigger
        id: reachable
      - condition: state
        entity_id: light.gaestezimmer_decke
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 00:30:00
            before: 07:00:00
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ night_brightness }}'
              color_temp_kelvin: '{{ night_kelvin }}'
              transition: '{{ night_transition }}'
        - conditions:
          - condition: time
            after: 07:00:00
            before: 09:30:00
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ morning_brightness }}'
              color_temp_kelvin: '{{ morning_kelvin }}'
              transition: '{{ morning_transition }}'
        - conditions:
          - condition: time
            after: 09:30:00
            before: '17:30:00'
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ day_brightness }}'
              color_temp_kelvin: '{{ day_kelvin }}'
              transition: '{{ day_transition }}'
        - conditions:
          - condition: time
            after: '17:30:00'
            before: '22:00:00'
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ evening_brightness }}'
              color_temp_kelvin: '{{ evening_kelvin }}'
              transition: '{{ evening_transition }}'
        - conditions:
          - condition: time
            after: '22:00:00'
            before: 00:30:00
          sequence:
          - action: light.turn_on
            data:
              entity_id: '{{ light_group }}'
              brightness_pct: '{{ late_brightness }}'
              color_temp_kelvin: '{{ late_kelvin }}'
              transition: '{{ late_transition }}'
  variables:
    light_group: light.gastezimmer_2
    morning_brightness: 60
    morning_kelvin: 3800
    morning_transition: 2
    day_brightness: 100
    day_kelvin: 6000
    day_transition: 1
    evening_brightness: 75
    evening_kelvin: 3300
    evening_transition: 2
    late_brightness: 30
    late_kelvin: 2400
    late_transition: 3
    night_brightness: 1
    night_kelvin: 2400
    night_transition: 2
    off_transition: 3
  mode: restart
