- id: '1771557943974'
  alias: Flur - Licht Motion nach Tageszeit
  description: Schaltet Dekolampe, Flur 1 und Flur 2 bei Bewegung je nach Tageszeit.
    Der Nachlauf startet erst, wenn beide Flur-Bewegungsmelder wieder frei sind.
  triggers:
  - entity_id:
    - binary_sensor.hue_motion_sensor_2_bewegung
    - binary_sensor.hue_motion_sensor_4_bewegung
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - variables:
      motion_sensors:
      - binary_sensor.hue_motion_sensor_2_bewegung
      - binary_sensor.hue_motion_sensor_4_bewegung
      periode: "{% set t = now().strftime('%H:%M') %} {% if '07:01' <= t <= '09:00'
        %}\n  morgens\n{% elif '09:01' <= t <= '20:00' %}\n  tag\n{% elif '20:01'
        <= t <= '23:59' %}\n  abends\n{% else %}\n  nacht\n{% endif %}"
      transition_seconds: "{% set p = periode | trim %} {% if p == 'nacht' %}\n  2\n{%
        elif p == 'tag' %}\n  0.5\n{% else %}\n  1\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ periode | trim == ''nacht'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.dekolampe
        data:
          brightness_pct: 30
          transition: '{{ transition_seconds | float }}'
      - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq',
          'on')\n   | list\n   | count == 0 }}"
        continue_on_timeout: false
      - delay:
          seconds: 30
      - condition: template
        value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq',
          'on')\n   | list\n   | count == 0 }}"
      - action: light.turn_off
        target:
          entity_id:
          - light.dekolampe
        data:
          transition: '{{ transition_seconds | float }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''morgens'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.dekolampe
            - light.flur_1
            - light.flur_2
          data:
            brightness_pct: 65
            transition: '{{ transition_seconds | float }}'
      - conditions:
        - condition: template
          value_template: '{{ periode | trim == ''tag'' }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.dekolampe
            - light.flur_1
            - light.flur_2
          data:
            brightness_pct: 90
            transition: '{{ transition_seconds | float }}'
      default:
      - action: light.turn_on
        target:
          entity_id:
          - light.dekolampe
          - light.flur_1
          - light.flur_2
        data:
          brightness_pct: 45
          transition: '{{ transition_seconds | float }}'
    - wait_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n
        \  | list\n   | count == 0 }}"
      continue_on_timeout: false
    - delay:
        minutes: 1
    - condition: template
      value_template: "{{ expand(motion_sensors)\n   | selectattr('state', 'eq', 'on')\n
        \  | list\n   | count == 0 }}"
    - action: light.turn_off
      target:
        entity_id:
        - light.dekolampe
        - light.flur_1
        - light.flur_2
      data:
        transition: '{{ transition_seconds | float }}'
  mode: restart
- id: '1771732921087'
  alias: Hue Dimmer Remote Kueche
  description: ''
  triggers:
  - entity_id:
    - event.hue_dimmer_switch_kuche_taste_1
    - event.hue_dimmer_switch_kuche_taste_2
    - event.hue_dimmer_switch_kuche_taste_3
    - event.hue_dimmer_switch_kuche_taste_4
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_1'') }}'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 07:00:00
            before: 09:30:00
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_morning }}'
              color_temp_kelvin: '{{ k_warm }}'
              transition: '{{ tr_on }}'
        - conditions:
          - condition: time
            after: 09:30:00
            before: '20:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_day }}'
              color_temp_kelvin: '{{ k_day }}'
              transition: '{{ tr_on }}'
        - conditions:
          - condition: time
            after: '20:00:00'
            before: '23:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_target }}'
            data:
              brightness_pct: '{{ b_evening }}'
              color_temp_kelvin: '{{ k_warm }}'
              transition: '{{ tr_on }}'
        default:
        - action: light.turn_on
          target:
            entity_id: '{{ light_target }}'
          data:
            brightness_pct: '{{ b_night }}'
            hs_color: '{{ hs_night }}'
            transition: '{{ tr_on }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_2'') }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_target }}'
        data:
          brightness_step_pct: '{{ step_pct }}'
          transition: '{{ tr_step }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_3'') }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_target }}'
        data:
          brightness_step_pct: '{{ 0 - step_pct }}'
          transition: '{{ tr_step }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.endswith(''taste_4'') }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ light_target }}'
        data:
          transition: '{{ tr_off }}'
  mode: restart
  variables:
    light_target: light.kuche_2
    b_morning: 60
    b_day: 100
    b_evening: 75
    b_night: 10
    k_warm: 2300
    k_day: 6000
    k_clean: 6000
    hs_night:
    - 220
    - 90
    tr_on: 2
    tr_off: 3
    tr_step: 1
    step_pct: 10
