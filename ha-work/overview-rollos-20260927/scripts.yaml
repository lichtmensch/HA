    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.terrassentur_rollo_rollo_terrassentur
          zielposition: 100
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.shelly2pmg3_8cbfea9a6bb0_rollo_gastezimmer
          zielposition: 100
    - sequence:
      - action: script.rollo_position_sicher_anfahren
        data:
          rollo: cover.shelly2pmg3_8cbfea97b428_rollo_gaste_wc
          zielposition: 100
    - sequence:
      - action: script.rollo_position_sicher_anfahren
