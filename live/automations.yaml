- id: '1773106634183'
  alias: System - Intelligente Wochenübersicht
  description: Meldet sonntags nur bei Handlungsbedarf Hausgeräte-Batterien bis 10%, Updates oder aktive Shelly-Fehler
  triggers:
  - at: '10:00:00'
    trigger: time
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - variables:
      low_batteries: "{% set ns = namespace(items=[]) %} {% for s in states.sensor %}\n  {% set e = s.entity_id | lower %}\n\
        \  {% set excluded = 'iphone' in e or 'ipad' in e or 'watch' in e\n    or 'macbook' in e or 'wby' in e or 'ix1' in\
        \ e\n    or 'state_of_charge' in e or 'robotic_vacuum' in e or 's8_maxv' in e %}\n  {% if state_attr(e, 'device_class')\
        \ == 'battery'\n    and state_attr(e, 'unit_of_measurement') == '%'\n    and not excluded and s.state not in ['unknown',\
        \ 'unavailable', 'none', ''] %}\n    {% set value = s.state | int(-1) %}\n    {% if value >= 0 and value <= 10 %}\n\
        \      {% set ns.items = ns.items + [s.name ~ ' (' ~ value ~ ' %)'] %}\n    {% endif %}\n  {% endif %}\n{% endfor\
        \ %} {{ ns.items }}"
      available_updates: "{% set ns = namespace(items=[]) %} {% for u in states.update %}\n  {% if u.state == 'on' %}\n  \
        \  {% set installed = state_attr(u.entity_id, 'installed_version') | default('unbekannt', true) %}\n    {% set latest\
        \ = state_attr(u.entity_id, 'latest_version') | default('unbekannt', true) %}\n    {% set ns.items = ns.items + [u.name\
        \ ~ ' (' ~ installed ~ ' → ' ~ latest ~ ')'] %}\n  {% endif %}\n{% endfor %} {{ ns.items }}"
      shelly_errors: "{% set ns = namespace(items=[]) %} {% for s in states.binary_sensor %}\n  {% set e = s.entity_id | lower\
        \ %}\n  {% if s.state == 'on'\n    and ('uberhitzung' in e or 'uberlast' in e or 'uberspannung' in e\n      or 'uberstrom'\
        \ in e or 'neustart_erforderlich' in e)\n    and ('rollo' in e or 'wohnzimmerfenster' in e or 'terrassentur' in e\n\
        \      or 'shelly2pmg3_' in e) %}\n    {% set ns.items = ns.items + [s.name] %}\n  {% endif %}\n{% endfor %} {{ ns.items\
        \ }}"
  - condition: template
    value_template: "{{ low_batteries | count > 0 or available_updates | count > 0\n  or shelly_errors | count > 0 }}"
  - action: !secret private_notify_1
    data:
      title: Home Assistant – Wochenübersicht
      message: '{% if low_batteries | count > 0 %}🔋 Batterien: {{ low_batteries | join('', '') }} {% endif %}{% if available_updates
        | count > 0 %}↻ Updates: {{ available_updates | join('', '') }} {% endif %}{% if shelly_errors | count > 0 %}⚠ Shelly-Fehler:
        {{ shelly_errors | join('', '') }}{% endif %}'
      data:
        tag: ha_weekly_system_status
        group: home_assistant_system
  mode: single
